name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  self-check:
    # ponytail: ubuntu-latest (26.04) has no Python 3.9 build; when ubuntu-24.04 is retired, run the 3.9 job in a python:3.9-slim container.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.9", "3.x"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Offline self-check
        run: python -I skills/laravel-upgrade/scripts/check.py
